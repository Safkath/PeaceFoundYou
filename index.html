  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      "use strict";

      const IS_LOCAL_PHP_SERVER = ["localhost", "127.0.0.1"].includes(location.hostname) && location.port === "8000";
      const COMMENTS_API_URL = location.protocol === "file:" ? "" : IS_LOCAL_PHP_SERVER ? "comments.php" : "/api/comments";
      const VIDEO_MANIFEST_URL = location.protocol === "file:" ? "" : IS_LOCAL_PHP_SERVER ? "videos.php" : "/api/videos";
      const VIDEO_DIR = "video";
      const MAX_VIDEO_NUMBER = 500;
      const SCAN_BATCH_SIZE = 12;
      const MAX_MISSING_GAP = 8;
      const STORAGE_PREFIX = "tavern-comments-v1:";
      const DISCOVERY_CACHE_KEY = "peacefoundyou-video-discovery-v2";
      const AMBIENT_STORAGE_KEY = "peacefoundyou-ambient-enabled";
      const DISCOVERY_CACHE_TTL = 5 * 60 * 1000;
      const MISSING_CACHE_TTL = 60 * 1000;
      const REQUEST_TIMEOUT = 5000;
      const VIDEO_TITLES = {
        1: "A Stillness in the Meadow"
      };
      const grid = document.getElementById("videoGrid");
      const modal = document.getElementById("videoModal");
      const modalShell = document.getElementById("modalShell");
      const modalVideo = document.getElementById("modalVideo");
      const randomVideoButton = document.getElementById("randomVideoButton");
      const immersiveButton = document.getElementById("immersiveBtn");
      const fullscreenButton = document.getElementById("fullscreenBtn");
      const playerTitle = document.getElementById("playerTitle");
      const ambientAudio = document.getElementById("ambientAudio");
      const ambientToggle = document.getElementById("ambientToggle");
      const ambientLabel = document.getElementById("ambientLabel");
      const discordCopy = document.getElementById("discordCopy");
      const discordLabel = document.getElementById("discordLabel");
      const progressBar = document.getElementById("progressBar");
      const progressFill = document.getElementById("progressFill");
      const timeDisplay = document.getElementById("timeDisplay");
      const muteBtn = document.getElementById("muteBtn");
      const volumeSlider = document.getElementById("volumeSlider");
      const commentList = document.getElementById("commentList");
      const commentCount = document.getElementById("commentCount");
      const commentHeading = document.getElementById("commentHeading");
      const commentForm = document.getElementById("commentForm");
      const commentInput = document.getElementById("commentInput");
      const displayNameInput = document.getElementById("displayName");
      const toast = document.getElementById("toast");
      const playbackStatus = document.getElementById("playbackStatus");
      const playPauseBtn = document.getElementById("playPauseBtn");
      const loopBtn = document.getElementById("loopBtn");
      const closeModalButton = document.getElementById("closeModal");
      const requiredElements = [grid, modal, modalShell, modalVideo, randomVideoButton, immersiveButton, fullscreenButton, playerTitle, ambientAudio, ambientToggle, ambientLabel, discordCopy, discordLabel, progressBar, progressFill, timeDisplay, muteBtn, volumeSlider, commentList, commentCount, commentHeading, commentForm, commentInput, displayNameInput, toast, playbackStatus, playPauseBtn, loopBtn, closeModalButton, document.getElementById("prevBtn"), document.getElementById("nextBtn")];
      if (requiredElements.some((element) => !element)) return;
      const sendButton = commentForm.querySelector('button[type="submit"]');
      const commentCache = new Map();
      let videos = [];
      let commentsBackendUnavailable = !COMMENTS_API_URL.trim();
      let backendFallbackNotified = false;
      let currentIndex = 0;
      let audioContext = null;
      let audioGain = null;
      let audioSource = null;
      let audioGraphAttempted = false;
      let audioGraphReady = false;
      let ambientEnabled = readAmbientPreference();
      let ambientStartPromise = null;
      let ambientBlockedNotified = false;
      let toastTimer = 0;
      let commentPollTimer = 0;
      let dragScrubbing = false;
      let previousFocus = null;
      let previousRandomIndex = -1;
      let playerRequest = 0;
      let commentSubmitting = false;
      let activePreview = null;
      const previewByCard = new WeakMap();
      const itemByCard = new WeakMap();
      const reducedMotion = window.matchMedia
        ? window.matchMedia("(prefers-reduced-motion: reduce)")
        : { matches: false };

      const previewObserver = "IntersectionObserver" in window
        ? new IntersectionObserver((entries) => {
            for (const entry of entries) {
              const card = entry.target;
              if (entry.isIntersecting) {
                loadPreview(card);
              }
              if (!entry.isIntersecting) {
                const preview = previewByCard.get(card);
                if (preview) {
                  preview.pause();
                  if (activePreview === preview) activePreview = null;
                }
              }
            }
          }, { threshold: 0.08 })
        : null;

      const formatTime = (seconds) => {
        if (!Number.isFinite(seconds) || seconds < 0) return "0:00";
        const minutes = Math.floor(seconds / 60);
        const remainder = Math.floor(seconds % 60).toString().padStart(2, "0");
        return `${minutes}:${remainder}`;
      };

      const videoTitle = (videoNumber) => VIDEO_TITLES[videoNumber] || `Quiet Moment ${videoNumber}`;

      function readAmbientPreference() {
        try {
          const saved = localStorage.getItem(AMBIENT_STORAGE_KEY);
          return saved === null ? true : saved === "true";
        } catch {
          return true;
        }
      }

      function saveAmbientPreference() {
        try {
          localStorage.setItem(AMBIENT_STORAGE_KEY, String(ambientEnabled));
        } catch {
          showToast("Ambient sound is on for this visit, but the preference could not be saved.");
        }
      }

      function loadPreview(card) {
        const preview = previewByCard.get(card);
        const item = itemByCard.get(card);
        if (!preview || !item || preview.getAttribute("src")) return;
        preview.preload = "metadata";
        preview.src = item.src;
        preview.load();
      }

      function playCardPreview(card) {
        const preview = previewByCard.get(card);
        if (!preview || modal.classList.contains("active")) return;
        if (activePreview && activePreview !== preview) activePreview.pause();
        activePreview = preview;
        loadPreview(card);
        const play = () => {
          if (activePreview !== preview || !card.matches(":hover")) return;
          preview.play().catch(() => {
            if (!card.classList.contains("ready")) {
              const status = card.querySelector(".card-status");
              if (status) {
                status.textContent = "Preview unavailable";
                status.hidden = false;
              }
            }
          });
        };
        if (preview.readyState >= 2) {
          play();
        } else {
          preview.addEventListener("loadeddata", play, { once: true });
        }
      }

      if (!previewObserver) {
        let viewportCheckFrame = 0;
        const refreshVisiblePreviews = () => {
          viewportCheckFrame = 0;
          for (const card of grid.querySelectorAll(".video-card")) {
            const bounds = card.getBoundingClientRect();
            const visible = bounds.bottom > 0 && bounds.top < window.innerHeight && bounds.right > 0 && bounds.left < window.innerWidth;
            const preview = previewByCard.get(card);
            if (visible) loadPreview(card);
            else if (preview) {
              preview.pause();
              if (activePreview === preview) activePreview = null;
            }
          }
        };
        const scheduleVisiblePreviews = () => {
          if (!viewportCheckFrame) viewportCheckFrame = window.requestAnimationFrame(refreshVisiblePreviews);
        };
        window.addEventListener("scroll", scheduleVisiblePreviews, { passive: true });
        window.addEventListener("resize", scheduleVisiblePreviews, { passive: true });
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => toast.classList.remove("show"), 3200);
      }

      function updateAmbientButton() {
        ambientToggle.setAttribute("aria-pressed", String(ambientEnabled));
        ambientToggle.setAttribute("aria-label", ambientEnabled ? "Pause ambient music" : "Play ambient music");
        ambientLabel.textContent = ambientEnabled ? "Ambient on" : "Ambient sound";
      }

      function startAmbient(fromUserGesture = false) {
        if (!ambientEnabled || modal.classList.contains("active") || !ambientAudio.paused) return Promise.resolve();
        if (ambientStartPromise && !fromUserGesture) return ambientStartPromise;
        ambientAudio.volume = .26;
        const request = ambientAudio.play().then(() => {
          ambientBlockedNotified = false;
          if (!ambientEnabled || modal.classList.contains("active")) {
            ambientAudio.pause();
            return;
          }
          updateAmbientButton();
        }).catch(() => {
          if (ambientEnabled && !ambientBlockedNotified) {
            ambientBlockedNotified = true;
            showToast("Ambient sound is ready. If playback is blocked, interact with the page once to start it.");
          }
        }).finally(() => {
          if (ambientStartPromise === request) ambientStartPromise = null;
        });
        ambientStartPromise = request;
        return ambientStartPromise;
      }

      function stopAmbient(reset = false) {
        ambientAudio.pause();
        if (reset) ambientAudio.currentTime = 0;
      }

      async function copyDiscordName() {
        const username = "noolaowq";
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(username);
          } else {
            const field = document.createElement("textarea");
            field.value = username;
            field.setAttribute("readonly", "");
            field.style.position = "fixed";
            field.style.opacity = "0";
            document.body.append(field);
            field.select();
            const copied = document.execCommand("copy");
            field.remove();
            if (!copied) throw new Error("Clipboard permission is unavailable.");
          }
          discordLabel.textContent = "Copied!";
          discordCopy.setAttribute("aria-label", "Discord username copied");
          showToast("Discord username copied: noolaowq");
          window.setTimeout(() => {
            discordLabel.textContent = "Discord · noolaowq";
            discordCopy.setAttribute("aria-label", "Copy Discord username noolaowq");
          }, 1800);
        } catch {
          showToast("Could not copy automatically. Discord username: noolaowq");
        }
      }

      function discoverBackground() {
        const layer = document.getElementById("backgroundPhoto");
        const candidates = ["background.jpg", "bg.jpg", "bg.png", "bg.webp", "bg1.jpg", "bg2.jpg", "bg3.jpg"];
        function tryBackground(index) {
          if (index >= candidates.length) return;
          const file = candidates[index];
          const image = new Image();
          image.onload = () => {
            layer.style.backgroundImage = `url("${file}")`;
            layer.style.opacity = ".7";
          };
          image.onerror = () => tryBackground(index + 1);
          image.src = file;
        }
        tryBackground(0);
      }

      function createEmbers() {
        const canvas = document.getElementById("embers");
        if (!canvas) return;
        const context = canvas.getContext("2d");
        if (!context) return;
        let width = 0;
        let height = 0;
        let ratio = 1;
        let frameId = 0;
        let lastFrameTime = 0;
        const motes = [];
        const rain = [];

        function resize() {
          ratio = Math.min(window.devicePixelRatio || 1, 2);
          width = window.innerWidth;
          height = window.innerHeight;
          canvas.width = Math.round(width * ratio);
          canvas.height = Math.round(height * ratio);
          context.setTransform(ratio, 0, 0, ratio, 0, 0);
          const count = reducedMotion.matches ? 0 : Math.min(70, Math.max(24, Math.round(width * height / 26000)));
          motes.length = 0;
          rain.length = 0;
          for (let i = 0; i < count; i++) {
            motes.push({
              x: Math.random() * width,
              y: Math.random() * height,
              radius: .5 + Math.random() * 1.7,
              rise: .12 + Math.random() * .42,
              sway: (Math.random() - .5) * .32,
              phase: Math.random() * Math.PI * 2,
              alpha: .2 + Math.random() * .55,
              ember: Math.random() > .38
            });
          }
          const rainCount = reducedMotion.matches ? 0 : Math.min(60, Math.max(16, Math.round(width / 24)));
          for (let i = 0; i < rainCount; i++) {
            rain.push({
              x: Math.random() * width,
              y: Math.random() * height,
              length: 7 + Math.random() * 18,
              speed: 2 + Math.random() * 4,
              alpha: .035 + Math.random() * .075
            });
          }
        }

        function draw(timestamp) {
          frameId = 0;
          if (document.hidden || reducedMotion.matches) return;
          if (timestamp - lastFrameTime < 33) {
            scheduleDraw();
            return;
          }
          lastFrameTime = timestamp;
          context.clearRect(0, 0, width, height);
          context.lineWidth = 1;
          for (const drop of rain) {
            context.strokeStyle = `rgba(174, 197, 211, ${drop.alpha})`;
            context.beginPath();
            context.moveTo(drop.x, drop.y);
            context.lineTo(drop.x - 1.5, drop.y + drop.length);
            context.stroke();
            drop.y += drop.speed;
            drop.x -= .35;
            if (drop.y > height + drop.length) {
              drop.y = -drop.length;
              drop.x = Math.random() * width;
            }
          }
          for (const mote of motes) {
            mote.y -= mote.rise;
            mote.x += mote.sway + Math.sin(mote.phase) * .12;
            mote.phase += .018;
            if (mote.y < -8) {
              mote.y = height + 8;
              mote.x = Math.random() * width;
            }
            if (mote.x < -8) mote.x = width + 8;
            if (mote.x > width + 8) mote.x = -8;
            const alpha = mote.alpha * (.55 + .45 * Math.sin(mote.phase * 1.7));
            const color = mote.ember ? `rgba(255, ${139 + Math.floor(55 * Math.sin(mote.phase))}, 54, ${alpha})` : `rgba(214, 225, 209, ${alpha * .58})`;
            const glow = context.createRadialGradient(mote.x, mote.y, 0, mote.x, mote.y, mote.radius * 5);
            glow.addColorStop(0, color);
            glow.addColorStop(1, "rgba(255, 160, 60, 0)");
            context.fillStyle = glow;
            context.beginPath();
            context.arc(mote.x, mote.y, mote.radius * 5, 0, Math.PI * 2);
            context.fill();
          }
          frameId = window.requestAnimationFrame(draw);
        }

        function scheduleDraw() {
          if (!frameId && !document.hidden && !reducedMotion.matches) {
            frameId = window.requestAnimationFrame(draw);
          }
        }

        resize();
        window.addEventListener("resize", resize, { passive: true });
        document.addEventListener("visibilitychange", () => {
          if (document.hidden && frameId) {
            window.cancelAnimationFrame(frameId);
            frameId = 0;
          } else {
            scheduleDraw();
          }
        });
        if (typeof reducedMotion.addEventListener === "function") {
          reducedMotion.addEventListener("change", () => {
            resize();
            if (reducedMotion.matches && frameId) {
              window.cancelAnimationFrame(frameId);
              frameId = 0;
            } else {
              scheduleDraw();
            }
          });
        } else if (typeof reducedMotion.addListener === "function") {
          reducedMotion.addListener(() => {
            resize();
            if (!reducedMotion.matches) scheduleDraw();
          });
        }
        scheduleDraw();
      }

      async function fetchWithTimeout(url, options = {}, timeout = REQUEST_TIMEOUT) {
        if (!("AbortController" in window)) {
          let timer;
          try {
            return await Promise.race([
              fetch(url, options),
              new Promise((_, reject) => {
                timer = window.setTimeout(() => reject(new Error("Request timed out.")), timeout);
              })
            ]);
          } finally {
            window.clearTimeout(timer);
          }
        }
        const controller = new AbortController();
        const timer = window.setTimeout(() => controller.abort(), timeout);
        try {
          return await fetch(url, { ...options, signal: controller.signal });
        } finally {
          window.clearTimeout(timer);
        }
      }

      function probeVideo(url) {
        return new Promise((resolve) => {
          const probe = document.createElement("video");
          let settled = false;
          const finish = (duration) => {
            if (settled) return;
            settled = true;
            window.clearTimeout(timeout);
            probe.removeAttribute("src");
            probe.load();
            resolve(duration);
          };
          const timeout = window.setTimeout(() => finish(undefined), REQUEST_TIMEOUT);
          probe.preload = "metadata";
          probe.muted = true;
          probe.onloadedmetadata = () => finish(Number.isFinite(probe.duration) ? probe.duration : 0);
          probe.onerror = () => finish(null);
          probe.src = url;
        });
      }

      async function checkVideoFile(src) {
        if (location.protocol === "file:") {
          const duration = await probeVideo(src);
          return Number.isFinite(duration) ? { src, duration } : null;
        }

        try {
          const response = await fetchWithTimeout(src, { method: "HEAD" });
          if (response.status === 404 || response.status === 410) return false;
          if (!response.ok) {
            const fallbackDuration = await probeVideo(src);
            return Number.isFinite(fallbackDuration) ? { src, duration: fallbackDuration } : undefined;
          }
          const duration = await probeVideo(src);
          return { src, duration: Number.isFinite(duration) ? duration : 0 };
        } catch {
          return null;
        }
      }

      async function findVideo(number) {
        const candidates = await Promise.all(["mp4", "webm", "mov"].map((extension) =>
          checkVideoFile(`${VIDEO_DIR}/video${number}.${extension}`)
        ));
        const found = candidates.find((candidate) => candidate && candidate !== false);
        if (found) return { number, ...found };
        return candidates.every((candidate) => candidate === false) ? null : undefined;
      }

      function readDiscoveryCache() {
        try {
          const raw = localStorage.getItem(DISCOVERY_CACHE_KEY);
          if (!raw) return {};
          const parsed = JSON.parse(raw);
          return parsed && typeof parsed === "object" && parsed.records && typeof parsed.records === "object"
            ? parsed.records
            : {};
        } catch {
          return {};
        }
      }

      function writeDiscoveryCache(records) {
        try {
          localStorage.setItem(DISCOVERY_CACHE_KEY, JSON.stringify({ records }));
        } catch {
          return;
        }
      }

      function applyVideoList(nextVideos) {
        const ordered = nextVideos.sort((a, b) => b.number - a.number);
        const unchanged = videos.length === ordered.length && videos.every((video, index) =>
          video.number === ordered[index].number && video.src === ordered[index].src && video.duration === ordered[index].duration
        );
        videos = ordered;
        randomVideoButton.disabled = videos.length === 0;
        if (!unchanged) renderGrid();
      }

      async function loadVideoManifest() {
        const response = await fetchWithTimeout(new URL(VIDEO_MANIFEST_URL, document.baseURI).href, {
          headers: { Accept: "application/json" },
          cache: "no-store"
        });
        if (!response.ok || !(response.headers.get("content-type") || "").toLowerCase().includes("application/json")) {
          throw new Error("Video manifest is unavailable.");
        }
        const payload = await response.json();
        if (!payload || !Array.isArray(payload.videos)) throw new Error("Video manifest has an invalid format.");
        const seen = new Set();
        return payload.videos.filter((item) => {
          if (!item || !Number.isInteger(item.number) || item.number < 1 || item.number > MAX_VIDEO_NUMBER || seen.has(item.number)) return false;
          const directMatch = typeof item.src === "string" && item.src.match(/^video\/video([1-9][0-9]{0,2})\.(mp4|webm|mov)(?:\?v=[a-f0-9]{16})?$/i);
          const rangedMatch = typeof item.src === "string" && item.src.match(/^media\.php\?video=video([1-9][0-9]{0,2})&format=(mp4|webm|mov)$/i);
          const match = rangedMatch || directMatch;
          if (!match || Number(match[1]) !== item.number) return false;
          seen.add(item.number);
          return true;
        }).map((item) => ({
          number: item.number,
          src: item.src,
          duration: Number.isFinite(Number(item.duration)) ? Math.max(0, Number(item.duration)) : 0
        })).sort((a, b) => b.number - a.number);
      }

      async function discoverVideos() {
        if (VIDEO_MANIFEST_URL) {
          try {
            applyVideoList(await loadVideoManifest());
            return;
          } catch {}
        }
        const records = readDiscoveryCache();
        const now = Date.now();
        const cachedVideos = Object.entries(records)
          .filter(([number, record]) => {
            const value = Number(number);
            if (!/^\d{1,3}$/.test(number) || String(value) !== number || value < 1 || value > MAX_VIDEO_NUMBER) return false;
            const source = record && typeof record.src === "string" ? record.src : "";
            const directMatch = source.match(/^video\/video([1-9][0-9]{0,2})\.(mp4|webm|mov)(?:\?v=[a-f0-9]{16})?$/i);
            const rangedMatch = source.match(/^media\.php\?video=video([1-9][0-9]{0,2})&format=(mp4|webm|mov)$/i);
            const match = rangedMatch || directMatch;
            const extension = (rangedMatch && rangedMatch[2] || directMatch && directMatch[2] || "").toLowerCase();
            return record && record.state === "found" && match && Number(match[1]) === value &&
              ["mp4", "webm", "mov"].includes(extension);
          })
          .map(([number, record]) => ({ number: Number(number), src: record.src, duration: Number(record.duration) || 0 }));
        if (cachedVideos.length) applyVideoList(cachedVideos);

        const found = new Map(cachedVideos.map((item) => [item.number, item]));
        let missingGap = 0;
        let networkError = false;
        for (let start = 1; start <= MAX_VIDEO_NUMBER; start += SCAN_BATCH_SIZE) {
          const end = Math.min(start + SCAN_BATCH_SIZE - 1, MAX_VIDEO_NUMBER);
          const batchNumbers = Array.from({ length: end - start + 1 }, (_, offset) => start + offset);
          const batch = await Promise.all(batchNumbers.map(async (number) => {
            const cached = records[number];
            if (cached && now - cached.checkedAt < (cached.state === "missing" ? MISSING_CACHE_TTL : DISCOVERY_CACHE_TTL)) {
              return cached.state === "found"
                ? { number, src: cached.src, duration: Number(cached.duration) || 0 }
                : cached.state === "missing" ? null : undefined;
            }

            const item = await findVideo(number);
            if (item === undefined) {
              networkError = true;
              return undefined;
            }
            records[number] = item
              ? { state: "found", src: item.src, duration: item.duration, checkedAt: Date.now() }
              : { state: "missing", checkedAt: Date.now() };
            return item;
          }));

          batch.forEach((item, index) => {
            if (item) {
              found.set(item.number, item);
              missingGap = 0;
            } else if (item === null) {
              found.delete(batchNumbers[index]);
              missingGap++;
            }
          });
          if (networkError || missingGap >= MAX_MISSING_GAP) break;
        }
        writeDiscoveryCache(records);
        applyVideoList([...found.values()]);
        if (networkError && !found.size) {
          showToast("Videos could not be discovered. Check the video folder connection and reload.");
        }
      }

      function readLocalComments(videoNumber) {
        try {
          const value = localStorage.getItem(`${STORAGE_PREFIX}${videoNumber}`);
          if (!value) return [];
          const parsed = JSON.parse(value);
          if (!Array.isArray(parsed)) return [];
          return normalizeComments(parsed);
        } catch {
          showToast("Comments could not be read from this browser's storage.");
          return [];
        }
      }

      function writeLocalComments(videoNumber, comments) {
        try {
          localStorage.setItem(`${STORAGE_PREFIX}${videoNumber}`, JSON.stringify(comments));
          return true;
        } catch {
          showToast("Your comment could not be saved. Check your browser storage settings.");
          return false;
        }
      }

      function fallbackComments(videoNumber) {
        const merged = new Map();
        for (const comment of [...(commentCache.get(videoNumber) || []), ...readLocalComments(videoNumber)]) {
          merged.set(comment.id, comment);
        }
        return [...merged.values()];
      }

      function normalizeComments(payload) {
        const values = Array.isArray(payload) ? payload : payload && Array.isArray(payload.comments) ? payload.comments : [];
        return values.filter((item) => item && typeof item === "object" && typeof item.text === "string").map((item, index) => ({
          id: String(item.id || `${item.createdAt || "remote"}-${index}`),
          name: String(item.name || item.displayName || "Traveler").slice(0, 32),
          text: item.text.slice(0, 500),
          createdAt: item.createdAt || item.timestamp || new Date().toISOString(),
          likes: Math.max(0, Number(item.likes) || 0),
          liked: Boolean(item.liked)
        }));
      }

      async function readApiResponse(response) {
        const contentType = response.headers.get("content-type") || "";
        if (response.status === 204) return null;
        if (response.ok && !contentType.toLowerCase().includes("application/json")) {
          throw new Error("The comments endpoint did not return JSON. Check the site's backend configuration.");
        }
        const payload = contentType.toLowerCase().includes("application/json") ? await response.json() : null;
        if (!response.ok) {
          const error = new Error(payload && typeof payload.error === "string" ? payload.error : `Comments service returned ${response.status}`);
          error.status = response.status;
          throw error;
        }
        return payload;
      }

      function stopCommentPolling() {
        window.clearInterval(commentPollTimer);
        commentPollTimer = 0;
      }

      function startCommentPolling() {
        if (!COMMENTS_API_URL.trim() || commentsBackendUnavailable || commentPollTimer || !modal.classList.contains("active")) return;
        commentPollTimer = window.setInterval(() => {
          if (modal.classList.contains("active")) renderComments(true);
          else stopCommentPolling();
        }, 20000);
      }

      async function loadComments(videoNumber, force = false) {
        if (!COMMENTS_API_URL.trim()) {
          const fallback = fallbackComments(videoNumber);
          commentCache.set(videoNumber, fallback);
          return fallback;
        }
        if (!force && !commentsBackendUnavailable && commentCache.has(videoNumber)) return commentCache.get(videoNumber);
        const separator = COMMENTS_API_URL.includes("?") ? "&" : "?";
        const url = `${new URL(COMMENTS_API_URL, document.baseURI).href}${separator}video=${encodeURIComponent(`video${videoNumber}`)}`;
        try {
          const response = await fetchWithTimeout(url, { headers: { Accept: "application/json" }, cache: "no-store" });
          const payload = response.status === 204 ? [] : await readApiResponse(response);
          const values = Array.isArray(payload) ? payload : payload && payload.comments;
          if (!Array.isArray(values)) throw new Error("Comments API must return an array or an object with a comments array.");
          const comments = normalizeComments(values);
          commentsBackendUnavailable = false;
          backendFallbackNotified = false;
          commentCache.set(videoNumber, comments);
          updateCardCount(videoNumber, comments);
          startCommentPolling();
          return comments;
        } catch (error) {
          commentsBackendUnavailable = true;
          stopCommentPolling();
          if (!backendFallbackNotified) {
            backendFallbackNotified = true;
            showToast("Shared comments are unavailable. Check the comments database configuration; browser-local comments will still work.");
          }
          const local = readLocalComments(videoNumber);
          commentCache.set(videoNumber, local);
          return local;
        }
      }

      async function submitSharedComment(videoNumber, comment) {
        const response = await fetchWithTimeout(new URL(COMMENTS_API_URL, document.baseURI).href, {
          method: "POST",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify({
            videoId: `video${videoNumber}`,
            name: comment.name,
            text: comment.text
          })
        });
        const payload = await readApiResponse(response);
        if (!payload || !Array.isArray(payload.comments)) {
          throw new Error("The comments endpoint returned an invalid response.");
        }
        commentCache.set(videoNumber, normalizeComments(payload.comments));
        commentsBackendUnavailable = false;
        backendFallbackNotified = false;
        startCommentPolling();
        return commentCache.get(videoNumber);
      }

      async function toggleCommentLike(videoNumber, comment, button) {
        button.disabled = true;
        const desiredState = !comment.liked;
        if (COMMENTS_API_URL.trim()) {
          try {
            const response = await fetchWithTimeout(new URL(COMMENTS_API_URL, document.baseURI).href, {
              method: "POST",
              headers: { "Content-Type": "application/json", Accept: "application/json" },
              body: JSON.stringify({
                action: "like",
                videoId: `video${videoNumber}`,
                commentId: comment.id,
                liked: desiredState
              })
            });
            const result = await readApiResponse(response);
            const updated = (commentCache.get(videoNumber) || []).map((entry) => entry.id === comment.id
              ? { ...entry, likes: Number(result.likes) || 0, liked: Boolean(result.liked) }
              : entry);
            commentsBackendUnavailable = false;
            backendFallbackNotified = false;
            commentCache.set(videoNumber, updated);
            renderComments();
            return;
          } catch (error) {
            if ([400, 404, 422, 429].includes(error.status)) {
              showToast(error.message);
              button.disabled = false;
              return;
            }
            commentsBackendUnavailable = true;
            if (!backendFallbackNotified) {
              backendFallbackNotified = true;
              showToast("Shared likes are unavailable. This like will be saved only in this browser.");
            }
          }
        }

        const updated = (commentCache.get(videoNumber) || []).map((entry) => entry.id === comment.id
          ? { ...entry, liked: desiredState, likes: Math.max(0, (Number(entry.likes) || 0) + (desiredState ? 1 : -1)) }
          : entry);
        commentCache.set(videoNumber, updated);
        writeLocalComments(videoNumber, updated);
        renderComments();
      }

      function updateCardCount(videoNumber, comments) {
        const count = comments || commentCache.get(videoNumber) || [];
        const card = grid.querySelector(`[data-video-number="${videoNumber}"]`);
        const badge = card && card.querySelector(".comment-count-value");
        if (badge) badge.textContent = String(count.length);
      }

      function commentTotal(videoNumber) {
        if (COMMENTS_API_URL.trim() && !commentsBackendUnavailable) return (commentCache.get(videoNumber) || []).length;
        return readLocalComments(videoNumber).length;
      }

      function renderGrid() {
        if (activePreview) {
          activePreview.pause();
          activePreview = null;
        }
        if (previewObserver) {
          grid.querySelectorAll(".video-card").forEach((card) => previewObserver.unobserve(card));
        }
        grid.querySelectorAll("video").forEach((preview) => {
          preview.pause();
          preview.removeAttribute("src");
          preview.load();
        });
        grid.replaceChildren();
        if (!videos.length) {
          const empty = document.createElement("div");
          empty.className = "empty-state";
          const heading = document.createElement("strong");
          heading.textContent = "Quiet places await";
          empty.append(heading, document.createTextNode("Add sequentially named videos to video/ (video1.mp4, video2.webm, video3.mov). If a file is skipped, check its filename and browser-supported codec."));
          grid.append(empty);
          return;
        }

        const fragment = document.createDocumentFragment();
        const renderedCards = [];
        videos.forEach((item, index) => {
          const card = document.createElement("article");
          card.className = "video-card";
          card.style.setProperty("--card-index", String(index % 12));
          card.dataset.videoNumber = String(item.number);
          card.tabIndex = 0;
          card.setAttribute("role", "button");
          card.setAttribute("aria-label", `Play ${videoTitle(item.number)}`);
          const poster = document.createElement("div");
          poster.className = "poster";
          const preview = document.createElement("video");
          preview.setAttribute("playsinline", "");
          preview.muted = true;
          preview.loop = true;
          preview.playsInline = true;
          preview.preload = "none";
          preview.style.transform = "translateZ(0)";
          preview.setAttribute("aria-hidden", "true");
          const shade = document.createElement("div");
          shade.className = "card-shade";
          const footer = document.createElement("div");
          footer.className = "card-footer";
          const meta = document.createElement("div");
          meta.className = "card-meta";
          const name = document.createElement("span");
          name.className = "video-name";
          name.textContent = videoTitle(item.number);
          const count = document.createElement("span");
          count.className = "comment-count";
          const countIcon = document.createElement("span");
          countIcon.setAttribute("aria-hidden", "true");
          countIcon.textContent = "▤";
          const countValue = document.createElement("span");
          countValue.className = "comment-count-value";
          countValue.textContent = String(commentTotal(item.number));
          count.append(countIcon, countValue);
          const duration = document.createElement("span");
          duration.className = "duration";
          duration.textContent = formatTime(item.duration);
          const status = document.createElement("div");
          status.className = "card-status";
          status.hidden = true;
          meta.append(name, count);
          footer.append(meta, duration);
          card.append(poster, preview, shade, status, footer);
          previewByCard.set(card, preview);
          itemByCard.set(card, item);

          const captureFrame = () => {
            if (card.classList.contains("ready") || preview.readyState < 2 || !preview.videoWidth || !preview.videoHeight) return;
            try {
              const frame = document.createElement("canvas");
              frame.width = Math.min(preview.videoWidth || 360, 720);
              frame.height = Math.max(1, Math.round(frame.width * (preview.videoHeight || 640) / (preview.videoWidth || 360)));
              frame.getContext("2d").drawImage(preview, 0, 0, frame.width, frame.height);
              poster.style.backgroundImage = `url("${frame.toDataURL("image/jpeg", .82)}")`;
              poster.style.backgroundSize = "cover";
              card.classList.add("ready");
              status.hidden = true;
            } catch {
              status.textContent = "Preview unavailable";
              status.hidden = false;
            }
          };

          preview.addEventListener("loadedmetadata", () => {
            if (Number.isFinite(preview.duration)) duration.textContent = formatTime(preview.duration);
          });
          preview.addEventListener("loadeddata", captureFrame);
          preview.addEventListener("error", () => {
            status.textContent = "This video could not be decoded";
            status.hidden = false;
          });
          card.addEventListener("mouseenter", () => {
            playCardPreview(card);
          });
          card.addEventListener("pointermove", (event) => {
            if (reducedMotion.matches) return;
            const bounds = card.getBoundingClientRect();
            card.style.setProperty("--pointer-x", `${((event.clientX - bounds.left) / bounds.width) * 100}%`);
            card.style.setProperty("--pointer-y", `${((event.clientY - bounds.top) / bounds.height) * 100}%`);
          });
          card.addEventListener("mouseleave", () => {
            preview.pause();
            if (activePreview === preview) activePreview = null;
          });
          card.addEventListener("click", () => openPlayer(index));
          card.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              openPlayer(index);
            }
          });
          fragment.append(card);
          renderedCards.push(card);
        });
        grid.append(fragment);
        if (previewObserver) {
          renderedCards.forEach((card) => previewObserver.observe(card));
        } else {
          for (const card of renderedCards) {
            const bounds = card.getBoundingClientRect();
            if (bounds.bottom > 0 && bounds.top < window.innerHeight && bounds.right > 0 && bounds.left < window.innerWidth) {
              loadPreview(card);
            }
          }
        }
      }

      function setupAudio() {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) {
          modalVideo.muted = false;
          modalVideo.volume = Math.min(1, Number(volumeSlider.value) / 2.5);
          showToast("Audio boost is unavailable in this browser; using standard video audio.");
          return Promise.resolve(false);
        }
        if (!audioGraphAttempted) {
          audioGraphAttempted = true;
          try {
            audioContext = new AudioContextClass();
            audioSource = audioContext.createMediaElementSource(modalVideo);
            audioGain = audioContext.createGain();
            const limiter = audioContext.createDynamicsCompressor();
            audioGain.gain.value = Math.min(2.5, Math.max(0, Number(volumeSlider.value)));
            limiter.threshold.value = -7;
            limiter.knee.value = 2;
            limiter.ratio.value = 16;
            limiter.attack.value = .003;
            limiter.release.value = .2;
            audioSource.connect(audioGain);
            audioGain.connect(limiter);
            limiter.connect(audioContext.destination);
            audioGraphReady = true;
          } catch {
            if (audioSource && audioContext) {
              try {
                audioSource.disconnect();
                audioSource.connect(audioContext.destination);
                audioGraphReady = true;
              } catch {
                audioGraphReady = false;
              }
            }
            audioGain = null;
            modalVideo.volume = Math.min(1, Number(volumeSlider.value) / 2.5);
            showToast("Audio boost could not be enabled; using standard video audio.");
          }
        }

        modalVideo.muted = false;
        if (!audioGraphReady || !audioContext) {
          modalVideo.volume = Math.min(1, Number(volumeSlider.value) / 2.5);
          return Promise.resolve(false);
        }
        modalVideo.volume = 1;
        return audioContext.resume().then(() => true).catch(() => {
          modalVideo.volume = Math.min(1, Number(volumeSlider.value) / 2.5);
          showToast("Audio could not be resumed. Use the player controls to try again.");
          return false;
        });
      }

      function updateMuteLabel() {
        const muted = modalVideo.muted || Number(volumeSlider.value) === 0;
        muteBtn.textContent = muted ? "Unmute" : "Mute";
        muteBtn.setAttribute("aria-label", muted ? "Unmute audio" : "Mute audio");
        muteBtn.setAttribute("aria-pressed", String(muted));
      }

      function setImmersive(enabled, moveFocus = true) {
        modalShell.classList.toggle("immersive", enabled);
        immersiveButton.setAttribute("aria-pressed", String(enabled));
        immersiveButton.setAttribute("aria-label", enabled ? "Show title, controls, and comments" : "Hide title, controls, and comments");
        immersiveButton.textContent = enabled ? "Show controls" : "Hide controls";
        if (moveFocus) {
          if (enabled) modalVideo.focus({ preventScroll: true });
          else immersiveButton.focus({ preventScroll: true });
        }
      }

      function isFullscreen() {
        return document.fullscreenElement === modalShell || document.webkitFullscreenElement === modalShell;
      }

      function updateFullscreenButton() {
        const active = isFullscreen() || modalShell.classList.contains("fullscreen-fallback");
        fullscreenButton.textContent = active ? "Exit fullscreen" : "Fullscreen";
        fullscreenButton.setAttribute("aria-label", active ? "Exit fullscreen" : "Enter fullscreen");
        fullscreenButton.setAttribute("aria-pressed", String(active));
      }

      async function toggleFullscreen() {
        if (isFullscreen() || modalShell.classList.contains("fullscreen-fallback")) {
          const exit = document.exitFullscreen || document.webkitExitFullscreen;
          if (isFullscreen() && exit) {
            try {
              await exit.call(document);
            } catch {
              modalShell.classList.remove("fullscreen-fallback");
              showToast("Fullscreen could not be exited automatically. Press Escape to leave it.");
            }
          } else {
            modalShell.classList.remove("fullscreen-fallback");
          }
          updateFullscreenButton();
          return;
        }

        const request = modalShell.requestFullscreen || modalShell.webkitRequestFullscreen;
        if (!request) {
          modalShell.classList.add("fullscreen-fallback");
          updateFullscreenButton();
          showToast("Using an immersive fullscreen view; native fullscreen is unavailable in this browser.");
          return;
        }
        try {
          await request.call(modalShell);
          modalShell.classList.remove("fullscreen-fallback");
        } catch {
          modalShell.classList.add("fullscreen-fallback");
          showToast("Native fullscreen was blocked. Using an immersive fullscreen view instead.");
        }
        updateFullscreenButton();
      }

      async function openPlayer(index) {
        if (!videos.length) return;
        if (activePreview) {
          activePreview.pause();
          activePreview = null;
        }
        const wasOpen = modal.classList.contains("active");
        if (!wasOpen) previousFocus = document.activeElement;
        const requestId = ++playerRequest;
        currentIndex = (index + videos.length) % videos.length;
        const item = videos[currentIndex];
        modal.classList.add("active");
        document.body.style.overflow = "hidden";
        if (!wasOpen && !modalShell.classList.contains("immersive")) closeModalButton.focus();
        stopAmbient();
        modalVideo.pause();
        modalVideo.preload = "auto";
        modalVideo.src = item.src;
        playerTitle.textContent = videoTitle(item.number);
        modalVideo.setAttribute("aria-label", videoTitle(item.number));
        modalVideo.load();
        playbackStatus.classList.remove("visible");
        progressFill.style.width = "0%";
        timeDisplay.textContent = `0:00 / ${formatTime(item.duration)}`;
        stopCommentPolling();
        updateMuteLabel();
        updatePlaybackControls();
        modalVideo.muted = false;
        modalVideo.volume = 1;
        const audioReady = setupAudio();
        const playback = modalVideo.play();
        renderComments(true);
        try {
          await playback;
          await audioReady;
          if (requestId !== playerRequest || !modal.classList.contains("active")) return;
          playbackStatus.classList.remove("visible");
          updateMuteLabel();
        } catch (error) {
          if (requestId !== playerRequest || !modal.classList.contains("active")) return;
          const mediaError = modalVideo.error;
          const reason = mediaError
            ? `This browser cannot decode this video (media error ${mediaError.code}). If it uses H.265/HEVC, convert it to H.264 MP4.`
            : error && error.message
              ? `This browser could not start the video: ${error.message}`
              : "This browser could not start the video. Check that the file uses a supported codec.";
          playbackStatus.textContent = reason;
          playbackStatus.classList.add("visible");
          showToast(reason);
          updateMuteLabel();
        }
      }

      function closePlayer() {
        if (!modal.classList.contains("active")) return;
        playerRequest++;
        if (isFullscreen()) {
          const exit = document.exitFullscreen || document.webkitExitFullscreen;
          if (exit) Promise.resolve(exit.call(document)).catch(() => {});
        }
        modalShell.classList.remove("fullscreen-fallback");
        setImmersive(false, false);
        updateFullscreenButton();
        modal.classList.remove("active");
        stopCommentPolling();
        document.body.style.overflow = "";
        modalVideo.pause();
        modalVideo.removeAttribute("src");
        modalVideo.load();
        if (audioContext && audioContext.state === "running") audioContext.suspend().catch(() => {});
        const restoreTarget = previousFocus;
        previousFocus = null;
        if (restoreTarget && restoreTarget.isConnected && typeof restoreTarget.focus === "function") {
          restoreTarget.focus();
        }
        if (ambientEnabled) startAmbient();
      }

      function updatePlaybackControls() {
        const playing = !modalVideo.paused;
        playPauseBtn.textContent = playing ? "Pause" : "Play";
        playPauseBtn.setAttribute("aria-label", playing ? "Pause video" : "Play video");
        playPauseBtn.setAttribute("aria-pressed", String(playing));
        loopBtn.textContent = modalVideo.loop ? "Loop on" : "Loop off";
        loopBtn.setAttribute("aria-pressed", String(modalVideo.loop));
        loopBtn.setAttribute("aria-label", modalVideo.loop ? "Turn looping off" : "Turn looping on");
      }

      async function renderComments(force = false) {
        if (!videos.length) return;
        const item = videos[currentIndex];
        const videoNumber = item.number;
        let comments;
        let unavailable = false;
        try {
          comments = await loadComments(videoNumber, force);
        } catch {
          comments = commentCache.get(videoNumber) || [];
          unavailable = true;
        }
        if (!modal.classList.contains("active") || !videos[currentIndex] || videos[currentIndex].number !== videoNumber) return;
        commentHeading.textContent = "Comments";
        commentCount.textContent = `${comments.length}`;
        commentList.replaceChildren();
        if (!comments.length) {
          const empty = document.createElement("div");
          empty.className = "no-comments";
          empty.textContent = unavailable ? "Comments are temporarily unavailable." : "No comments yet. Be the first to leave a note.";
          commentList.append(empty);
        }

        for (const comment of comments) {
          const row = document.createElement("article");
          row.className = "comment";
          const avatar = document.createElement("span");
          avatar.className = "avatar";
          avatar.setAttribute("aria-hidden", "true");
          avatar.textContent = (comment.name.trim()[0] || "T").toUpperCase();
          const body = document.createElement("div");
          body.className = "comment-body";
          const author = document.createElement("div");
          author.className = "comment-author";
          author.textContent = comment.name;
          const text = document.createElement("div");
          text.className = "comment-text";
          text.textContent = comment.text;
          const time = document.createElement("div");
          time.className = "comment-time";
          const posted = new Date(comment.createdAt);
          time.textContent = Number.isNaN(posted.getTime()) ? "" : posted.toLocaleString();
          body.append(author, text, time);
          const like = document.createElement("button");
          like.className = `like-button${comment.liked ? " liked" : ""}`;
          like.type = "button";
          like.setAttribute("aria-label", comment.liked ? "Unlike comment" : "Like comment");
          like.setAttribute("aria-pressed", String(Boolean(comment.liked)));
          like.textContent = `♥ ${comment.likes || 0}`;
          like.addEventListener("click", () => toggleCommentLike(videoNumber, comment, like));
          row.append(avatar, body, like);
          commentList.append(row);
        }
        updateCardCount(videoNumber, comments);
      }

      async function postComment(event) {
        event.preventDefault();
        if (commentSubmitting) return;
        const text = commentInput.value.trim();
        if (!text || !videos.length) return;
        commentSubmitting = true;
        if (sendButton) sendButton.disabled = true;
        const name = displayNameInput.value.trim() || "Traveler";
        const item = videos[currentIndex];
        const comment = {
          id: `${Date.now()}-${Math.random().toString(36).slice(2)}`,
          name,
          text,
          createdAt: new Date().toISOString(),
          likes: 0,
          liked: false
        };
        try {
          let comments;
          if (COMMENTS_API_URL.trim()) {
            try {
              comments = await submitSharedComment(item.number, comment);
            } catch (error) {
              if ([400, 422, 429].includes(error.status)) {
                showToast(error.message);
                return;
              }
              commentsBackendUnavailable = true;
              comments = [...fallbackComments(item.number), comment];
              if (!writeLocalComments(item.number, comments)) return;
              commentCache.set(item.number, comments);
              showToast("Shared comments are unavailable. Your note was saved only in this browser.");
            }
          } else {
            comments = [...readLocalComments(item.number), comment];
            if (!writeLocalComments(item.number, comments)) return;
            commentCache.set(item.number, comments);
            showToast("Saved on this device only. Configure the shared comments database to share comments.");
          }
          try { localStorage.setItem("tavern-display-name", name); } catch { showToast("Your comment was saved, but the display name could not be remembered."); }
          commentInput.value = "";
          await renderComments(false);
          commentList.scrollTop = commentList.scrollHeight;
        } finally {
          commentSubmitting = false;
          if (sendButton) sendButton.disabled = false;
        }
      }

      function seekToPointer(event) {
        if (!Number.isFinite(modalVideo.duration) || !modalVideo.duration) return;
        const bounds = progressBar.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, (event.clientX - bounds.left) / bounds.width));
        modalVideo.currentTime = ratio * modalVideo.duration;
      }

      modalVideo.addEventListener("click", () => {
        if (modalShell.classList.contains("immersive")) {
          setImmersive(false);
          return;
        }
        if (modalVideo.paused) {
          setupAudio().then(() => modalVideo.play()).catch(() => {
            playbackStatus.textContent = "This video could not be played. Check its format or try another file.";
            playbackStatus.classList.add("visible");
            showToast("Playback could not start. Check whether the video codec is supported.");
          });
        } else {
          modalVideo.pause();
        }
      });
      modalVideo.addEventListener("play", updatePlaybackControls);
      modalVideo.addEventListener("pause", updatePlaybackControls);
      modalVideo.addEventListener("playing", () => playbackStatus.classList.remove("visible"));
      modalVideo.addEventListener("waiting", () => {
        playbackStatus.textContent = "Buffering video…";
        playbackStatus.classList.add("visible");
      });
      modalVideo.addEventListener("error", () => {
        playbackStatus.textContent = "This video could not be decoded by the browser. H.265/HEVC files may need converting to H.264 MP4.";
        playbackStatus.classList.add("visible");
        updatePlaybackControls();
      });

      modalVideo.addEventListener("timeupdate", () => {
        const duration = modalVideo.duration;
        const percent = Number.isFinite(duration) && duration > 0 ? modalVideo.currentTime / duration * 100 : 0;
        progressFill.style.width = `${percent}%`;
        progressBar.setAttribute("aria-valuenow", String(Math.round(percent)));
        progressBar.setAttribute("aria-valuetext", `${Math.round(percent)} percent`);
        timeDisplay.textContent = `${formatTime(modalVideo.currentTime)} / ${formatTime(duration)}`;
      });
      modalVideo.addEventListener("loadedmetadata", () => {
        timeDisplay.textContent = `0:00 / ${formatTime(modalVideo.duration)}`;
      });
      progressBar.addEventListener("pointerdown", (event) => {
        dragScrubbing = true;
        progressBar.setPointerCapture(event.pointerId);
        seekToPointer(event);
      });
      progressBar.addEventListener("pointermove", (event) => {
        if (dragScrubbing) seekToPointer(event);
      });
      progressBar.addEventListener("pointerup", () => { dragScrubbing = false; });
      progressBar.addEventListener("pointercancel", () => { dragScrubbing = false; });
      progressBar.addEventListener("keydown", (event) => {
        if (!["ArrowLeft", "ArrowRight"].includes(event.key) || !Number.isFinite(modalVideo.duration)) return;
        event.preventDefault();
        modalVideo.currentTime = Math.max(0, Math.min(modalVideo.duration, modalVideo.currentTime + (event.key === "ArrowRight" ? 5 : -5)));
      });

      muteBtn.addEventListener("click", async () => {
        if (modalVideo.muted || Number(volumeSlider.value) === 0) {
          if (Number(volumeSlider.value) === 0) {
            volumeSlider.value = "2.2";
            if (audioGain && audioContext) audioGain.gain.setTargetAtTime(2.2, audioContext.currentTime, .035);
            else modalVideo.volume = .88;
          }
          await setupAudio();
          modalVideo.muted = false;
        } else {
          modalVideo.muted = true;
        }
        updateMuteLabel();
      });

      volumeSlider.addEventListener("input", () => {
        const value = Number(volumeSlider.value);
        if (audioGain) audioGain.gain.setTargetAtTime(value, audioContext.currentTime, .035);
        else modalVideo.volume = Math.min(1, value / 2.5);
        if (value > 0) modalVideo.muted = false;
        else modalVideo.muted = true;
        updateMuteLabel();
      });

      playPauseBtn.addEventListener("click", () => {
        if (modalVideo.paused) {
          setupAudio().then(() => modalVideo.play()).catch(() => showToast("Playback could not start."));
        } else {
          modalVideo.pause();
        }
      });
      loopBtn.addEventListener("click", () => {
        modalVideo.loop = !modalVideo.loop;
        updatePlaybackControls();
      });

      document.getElementById("closeModal").addEventListener("click", closePlayer);
      document.getElementById("prevBtn").addEventListener("click", () => openPlayer(currentIndex - 1));
      document.getElementById("nextBtn").addEventListener("click", () => openPlayer(currentIndex + 1));
      randomVideoButton.addEventListener("click", () => {
        if (!videos.length) return;
        let index = Math.floor(Math.random() * videos.length);
        if (videos.length > 1 && index === previousRandomIndex) {
          index = (index + 1 + Math.floor(Math.random() * (videos.length - 1))) % videos.length;
        }
        previousRandomIndex = index;
        openPlayer(index);
      });
      immersiveButton.addEventListener("click", () => setImmersive(!modalShell.classList.contains("immersive")));
      fullscreenButton.addEventListener("click", toggleFullscreen);
      const handleFullscreenChange = () => {
        if (!isFullscreen() && modalShell.classList.contains("immersive")) setImmersive(false);
        updateFullscreenButton();
      };
      document.addEventListener("fullscreenchange", handleFullscreenChange);
      document.addEventListener("webkitfullscreenchange", handleFullscreenChange);
      commentForm.addEventListener("submit", postComment);
      ambientToggle.addEventListener("click", () => {
        ambientEnabled = !ambientEnabled;
        saveAmbientPreference();
        updateAmbientButton();
        if (ambientEnabled) startAmbient();
        else stopAmbient(true);
      });
      ambientAudio.addEventListener("error", () => {
        if (ambientEnabled && !modal.classList.contains("active")) {
          showToast("Could not load bg.mp3. Keep it beside index.html and use a local server.");
        }
      });
      discordCopy.addEventListener("click", copyDiscordName);
      const resumeAmbientFromGesture = (event) => {
        if (event.isTrusted && ambientEnabled && !modal.classList.contains("active")) startAmbient(true);
      };
      document.addEventListener("pointerdown", resumeAmbientFromGesture, { capture: true, passive: true });
      document.addEventListener("keydown", resumeAmbientFromGesture, { capture: true });
      document.addEventListener("visibilitychange", () => {
        if (document.hidden && activePreview) {
          activePreview.pause();
          activePreview = null;
        }
        if (document.hidden) {
          modalVideo.pause();
          stopAmbient();
          if (audioContext && audioContext.state === "running") audioContext.suspend().catch(() => {});
        } else if (ambientEnabled && !modal.classList.contains("active")) {
          startAmbient();
        }
      });
      updateAmbientButton();
      startAmbient();
      modal.addEventListener("click", (event) => {
        if (event.target === modal) closePlayer();
      });

      document.addEventListener("keydown", (event) => {
        if (!modal.classList.contains("active")) return;
        if (event.key === "Escape") {
          event.preventDefault();
          if (modalShell.classList.contains("immersive") || modalShell.classList.contains("fullscreen-fallback")) {
            setImmersive(false);
            modalShell.classList.remove("fullscreen-fallback");
            if (isFullscreen()) {
              const exit = document.exitFullscreen || document.webkitExitFullscreen;
              if (exit) Promise.resolve(exit.call(document)).catch(() => {});
            }
            updateFullscreenButton();
            return;
          }
          closePlayer();
          return;
        }
        const target = event.target instanceof HTMLElement ? event.target : null;
        const typing = target && (target.isContentEditable || target.matches("input:not([type='range']), textarea, select"));
        if (event.key === "Tab") {
          const focusable = [...modal.querySelectorAll('button:not([disabled]), input:not([disabled]), [tabindex]:not([tabindex="-1"])')]
            .filter((element) => !element.hidden && getComputedStyle(element).visibility !== "hidden" && element.getClientRects().length);
          if (!focusable.length) {
            event.preventDefault();
            closeModalButton.focus();
            return;
          }
          const first = focusable[0];
          const last = focusable[focusable.length - 1];
          if (event.shiftKey && (document.activeElement === first || !modal.contains(document.activeElement))) {
            event.preventDefault();
            last.focus();
          } else if (!event.shiftKey && (document.activeElement === last || !modal.contains(document.activeElement))) {
            event.preventDefault();
            first.focus();
          }
          return;
        }
        if (typing) return;
        if (event.key === "ArrowUp" && !(target && target.matches("input[type='range']"))) {
          event.preventDefault();
          openPlayer(currentIndex - 1);
        }
        if (event.key === "ArrowDown" && !(target && target.matches("input[type='range']"))) {
          event.preventDefault();
          openPlayer(currentIndex + 1);
        }
        if (event.code === "Space" && !(target && target.matches("button, a, input[type='range'], [role='slider']"))) {
          event.preventDefault();
          if (modalVideo.paused) {
            setupAudio().then(() => modalVideo.play()).catch(() => showToast("Playback could not start."));
          } else {
            modalVideo.pause();
          }
        }
      });

      try {
        displayNameInput.value = localStorage.getItem("tavern-display-name") || "Traveler";
      } catch {
        displayNameInput.value = "Traveler";
      }
      discoverBackground();
      createEmbers();
      discoverVideos();
    })();
  </script>
</body>
</html>
