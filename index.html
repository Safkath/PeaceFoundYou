<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07080a">
  <meta name="description" content="PeaceFoundYou — a quiet little place for calming videos and ambient sound.">
  <link rel="icon" type="image/png" href="peacefoundyou-icon.png">
  <link rel="apple-touch-icon" href="peacefoundyou-icon.png">
  <title>PeaceFoundYou</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #07080a;
      --amber: #d99b56;
      --gold: #f4d5a5;
      --muted: #a9aaa3;
      --line: rgba(216, 205, 182, .15);
      --glass: rgba(16, 20, 20, .9);
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; background: var(--ink); }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: #f7efe3;
      background: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .backdrop {
      position: fixed;
      z-index: 0;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse 70% 55% at 18% 82%, rgba(217, 155, 86, .16), transparent 72%),
        radial-gradient(ellipse 70% 62% at 82% 28%, rgba(56, 95, 138, .20), transparent 72%),
        radial-gradient(ellipse 80% 60% at 54% 92%, rgba(16, 34, 28, .32), transparent 72%),
        #07080a;
    }

    .background-photo {
      position: absolute;
      inset: -3%;
      background-image: url("background.jpg");
      background-position: center;
      background-size: cover;
      opacity: .7;
      filter: blur(2px) brightness(.62) saturate(.84);
      transform: scale(1.035);
      transition: opacity .8s ease;
    }

    .backdrop::after {
      position: absolute;
      inset: 0;
      content: "";
      background:
        radial-gradient(ellipse at 50% 45%, transparent 28%, rgba(3, 5, 6, .48) 100%),
        linear-gradient(180deg, rgba(7, 8, 10, .12), rgba(7, 8, 10, .16) 50%, rgba(7, 8, 10, .48));
    }

    .backdrop::before {
      position: absolute;
      inset: 0;
      content: "";
      background:
        radial-gradient(ellipse 52% 22% at 52% 14%, rgba(151, 174, 193, .13), transparent 74%),
        radial-gradient(ellipse 65% 18% at 58% 31%, rgba(69, 92, 113, .16), transparent 76%),
        radial-gradient(ellipse 72% 24% at 48% 100%, rgba(37, 74, 54, .38), transparent 72%),
        linear-gradient(180deg, transparent 53%, rgba(8, 17, 15, .12) 69%, rgba(7, 13, 12, .5));
    }

    .mist {
      position: absolute;
      width: 52vw;
      height: 45vw;
      border-radius: 50%;
      filter: blur(100px);
      opacity: .16;
      pointer-events: none;
      animation: wander 25s ease-in-out infinite alternate;
    }

    .mist-one { left: -20vw; bottom: -34vw; background: #30583e; }
    .mist-two { right: -25vw; top: 10vh; background: #385f8a; animation-delay: -12s; }

    @keyframes wander {
      to { transform: translate3d(8vw, -5vh, 0) scale(1.12); }
    }

    #embers {
      position: fixed;
      z-index: 1;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .grain {
      position: fixed;
      z-index: 5;
      inset: 0;
      opacity: .035;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .site-header {
      position: relative;
      z-index: 2;
      display: flex;
      width: min(100% - 44px, 1180px);
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin: 0 auto;
      padding: 27px 0 4px;
    }

    .brand { display: grid; gap: 5px; }
    .brand-title {
      margin: 0;
      color: #f6f0e5;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(26px, 4vw, 39px);
      font-weight: 400;
      letter-spacing: -.045em;
      line-height: 1;
      text-shadow: 0 2px 24px rgba(221, 193, 145, .2);
    }

    .brand-title span { color: #e4c69a; }
    .brand-byline { margin: 0; color: rgba(232, 224, 209, .72); font-size: 11px; letter-spacing: .1em; }
    .brand-byline strong { color: #e4c69a; font-weight: 500; }
    .menu-controls { display: flex; align-items: center; gap: 9px; }

    .menu-button {
      display: inline-flex;
      min-height: 38px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 13px;
      border: 1px solid rgba(232, 210, 176, .2);
      border-radius: 999px;
      background: rgba(15, 20, 19, .66);
      color: #efe7d9;
      cursor: pointer;
      font-size: 11px;
      backdrop-filter: blur(12px);
      transition: border-color .2s ease, background .2s ease, transform .2s ease, box-shadow .2s ease;
    }

    .menu-button:hover, .menu-button[aria-pressed="true"] {
      transform: translateY(-1px);
      border-color: rgba(224, 194, 146, .52);
      background: rgba(48, 47, 36, .72);
      box-shadow: 0 0 22px rgba(213, 171, 106, .12);
    }

    .menu-button:active, .send-button:active, .skip-controls button:active, .close-button:active { transform: scale(.96); }
    button:focus-visible, .video-card:focus-visible, .progress-track:focus-visible {
      outline: 2px solid rgba(240, 213, 171, .82);
      outline-offset: 3px;
    }

    .menu-button svg { width: 16px; height: 16px; flex: 0 0 auto; }
    .music-indicator { display: flex; height: 14px; align-items: center; gap: 2px; }
    .music-indicator i { width: 2px; height: 5px; border-radius: 2px; background: #e3c18d; }
    .ambient-toggle[aria-pressed="true"] .music-indicator i { animation: music-wave .8s ease-in-out infinite alternate; }
    .music-indicator i:nth-child(2) { animation-delay: -.35s; }
    .music-indicator i:nth-child(3) { animation-delay: -.55s; }
    .music-indicator i:nth-child(4) { animation-delay: -.2s; }

    @keyframes music-wave {
      to { height: 13px; }
    }

    main {
      position: relative;
      z-index: 2;
      width: min(100% - 44px, 1180px);
      margin: 0 auto;
      padding: 22px 0 70px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(205px, 1fr));
      gap: 17px;
    }

    .vibe-invitation {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin: 0 0 20px;
      padding: 17px 19px;
      border: 1px solid rgba(226, 180, 111, .14);
      border-radius: 11px;
      background: linear-gradient(110deg, rgba(28, 27, 21, .74), rgba(13, 17, 16, .6));
      box-shadow: inset 0 0 28px rgba(234, 151, 44, .025);
      backdrop-filter: blur(10px);
    }

    .vibe-copy { display: grid; gap: 5px; }
    .vibe-title {
      margin: 0;
      color: #f3e5cd;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(18px, 2.4vw, 23px);
      font-weight: 400;
      letter-spacing: -.025em;
    }
    .vibe-caption { margin: 0; color: rgba(232, 224, 209, .66); font-size: 11px; }
    .vibe-button {
      display: inline-flex;
      min-height: 39px;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 15px;
      border: 1px solid rgba(231, 183, 111, .42);
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(112, 78, 42, .78), rgba(40, 47, 39, .82));
      color: #f5e6ca;
      cursor: pointer;
      font-size: 11px;
      box-shadow: 0 0 23px rgba(190, 133, 69, .1);
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .vibe-button:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: rgba(246, 209, 157, .76);
      box-shadow: 0 5px 25px rgba(190, 133, 69, .2);
    }
    .vibe-button:disabled { opacity: .48; cursor: wait; }
    .vibe-button svg { width: 14px; height: 14px; }

    .video-card {
      position: relative;
      aspect-ratio: 9 / 16;
      overflow: hidden;
      border: 1px solid rgba(226, 180, 111, .16);
      border-radius: 11px;
      background:
        radial-gradient(ellipse at 48% 65%, rgba(161, 88, 27, .3), transparent 52%),
        linear-gradient(155deg, rgba(40, 31, 24, .93), rgba(9, 7, 6, .98));
      box-shadow: 0 13px 36px rgba(0, 0, 0, .5), inset 0 0 28px rgba(234, 151, 44, .035);
      cursor: pointer;
      isolation: isolate;
      transition: transform .28s ease, border-color .28s ease, box-shadow .28s ease;
      animation: card-arrive .6s cubic-bezier(.2, .75, .25, 1) both;
      animation-delay: calc(var(--card-index, 0) * 35ms);
    }

    @keyframes card-arrive {
      from { opacity: 0; transform: translateY(12px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .video-card::before {
      position: absolute;
      z-index: 3;
      inset: 0;
      content: "";
      opacity: 0;
      background: radial-gradient(ellipse at var(--pointer-x, 50%) var(--pointer-y, 45%), rgba(244, 215, 169, .17), transparent 45%);
      pointer-events: none;
      transition: opacity .28s ease;
    }

    .video-card:hover {
      z-index: 1;
      transform: translateY(-6px) scale(1.012);
      border-color: rgba(230, 204, 161, .64);
      box-shadow: 0 22px 50px rgba(0, 0, 0, .5), 0 0 32px rgba(193, 173, 132, .2);
    }

    .video-card:hover::before { opacity: 1; }
    .video-card:active { transform: translateY(-1px) scale(.99); }
    .video-card video, .poster {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: translateZ(0);
    }

    .video-card video { z-index: 2; opacity: 0; will-change: transform; transition: opacity .25s ease; }
    .video-card.ready video { opacity: 1; }
    .video-card:hover video { transform: translateZ(0) scale(1.025); }

    .poster {
      z-index: 1;
      opacity: 1;
      transition: opacity .25s ease;
      background:
        radial-gradient(ellipse at 48% 53%, rgba(196, 163, 111, .24), transparent 48%),
        linear-gradient(165deg, rgba(48, 58, 52, .9), rgba(10, 13, 14, .98));
    }

    .video-card.ready .poster { opacity: 0; }

    .card-shade {
      position: absolute;
      z-index: 4;
      inset: 35% 0 0;
      background: linear-gradient(transparent, rgba(5, 4, 3, .82));
      pointer-events: none;
    }

    .card-shade::after {
      position: absolute;
      top: -25%;
      left: 50%;
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      border: 1px solid rgba(255, 246, 229, .38);
      border-radius: 50%;
      background: rgba(12, 14, 14, .48);
      color: #fff8eb;
      content: "▶";
      font-size: 15px;
      opacity: 0;
      transform: translate(-50%, 8px) scale(.88);
      transition: opacity .24s ease, transform .24s ease, background .24s ease;
      backdrop-filter: blur(8px);
    }

    .video-card:hover .card-shade::after, .video-card:focus-visible .card-shade::after {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
    }

    .card-footer {
      position: absolute;
      z-index: 5;
      right: 10px;
      bottom: 10px;
      left: 10px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 8px;
      text-shadow: 0 1px 5px #000;
      pointer-events: none;
    }

    .card-meta { display: grid; gap: 5px; min-width: 0; margin-left: auto; justify-items: end; text-align: right; }
    .video-name { overflow: hidden; color: #f8eddd; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .comment-count { display: inline-flex; align-items: center; gap: 5px; color: rgba(250, 239, 222, .8); font-size: 11px; }
    .duration {
      padding: 4px 7px;
      border: 1px solid rgba(248, 220, 178, .18);
      border-radius: 5px;
      background: rgba(12, 9, 7, .7);
      color: #fff3df;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      transition: box-shadow .25s ease, border-color .25s ease;
    }

    .video-card:hover .duration {
      border-color: rgba(245, 183, 91, .65);
      box-shadow: 0 0 13px rgba(245, 158, 11, .38);
    }

    .empty-state {
      grid-column: 1 / -1;
      padding: 120px 24px;
      color: #c9b99f;
      text-align: center;
      font-size: 14px;
      line-height: 1.8;
    }

    .empty-state strong { display: block; margin-bottom: 8px; color: #f2d5a5; font-size: 18px; font-weight: 550; }

    .card-status, .playback-status {
      position: absolute;
      z-index: 5;
      left: 50%;
      padding: 8px 11px;
      border: 1px solid rgba(236, 210, 170, .2);
      border-radius: 7px;
      background: rgba(8, 11, 12, .82);
      color: #ead9bd;
      font-size: 11px;
      line-height: 1.4;
      text-align: center;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .card-status { top: 48%; width: calc(100% - 24px); }
    .playback-status { top: 50%; display: none; max-width: calc(100% - 32px); }
    .playback-status.visible { display: block; }

    .modal {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: rgba(3, 3, 4, .88);
      backdrop-filter: blur(18px);
    }

    .modal.active { display: flex; }
    .modal-shell.fullscreen-fallback {
      position: fixed;
      z-index: 20;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-height: none;
      border: 0;
      border-radius: 0;
    }
    .modal-shell:fullscreen,
    .modal-shell:-webkit-full-screen {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-height: none;
      border: 0;
      border-radius: 0;
    }

    .modal-shell {
      position: relative;
      display: flex;
      width: min(100%, 1050px);
      height: min(88vh, 850px);
      overflow: hidden;
      border: 1px solid rgba(221, 175, 111, .22);
      border-radius: 15px;
      background: rgba(12, 10, 9, .96);
      box-shadow: 0 28px 100px rgba(0, 0, 0, .8), 0 0 65px rgba(199, 110, 30, .08);
    }

    .player-side {
      position: relative;
      display: flex;
      flex: 1 1 auto;
      min-width: 0;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 85%, rgba(174, 87, 22, .17), transparent 60%),
        #050403;
    }

    .player-video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #050403;
      transform: translateZ(0);
      will-change: transform;
    }

    .player-title {
      position: absolute;
      z-index: 3;
      top: 18px;
      right: 68px;
      left: 64px;
      overflow: hidden;
      color: #f4e8d4;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 15px;
      text-overflow: ellipsis;
      text-shadow: 0 2px 12px rgba(0, 0, 0, .9);
      white-space: nowrap;
      pointer-events: none;
    }

    .modal.active .modal-shell { animation: modal-arrive .24s cubic-bezier(.2, .8, .25, 1) both; }
    @keyframes modal-arrive {
      from { opacity: .7; transform: translateY(8px) scale(.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .close-button {
      position: absolute;
      z-index: 3;
      top: 14px;
      left: 14px;
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 1px solid rgba(255, 242, 220, .16);
      border-radius: 50%;
      background: rgba(9, 8, 7, .7);
      cursor: pointer;
    }

    .close-button:hover, .transport button:hover { background: rgba(100, 62, 28, .75); }
    .modal-shell.immersive .player-title,
    .modal-shell.immersive .transport,
    .modal-shell.immersive .skip-controls,
    .modal-shell.immersive .close-button {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .modal-shell.immersive .comments-panel { display: none; }
    .modal-shell.immersive .player-side { flex: 1 1 100%; width: 100%; min-width: 100%; }
    .modal-shell.immersive #modalVideo { cursor: none; }

    .transport {
      position: absolute;
      right: 15px;
      bottom: 14px;
      left: 15px;
      display: grid;
      gap: 10px;
      padding: 24px 8px 3px;
      background: linear-gradient(transparent, rgba(0, 0, 0, .7));
    }

    .progress-track {
      height: 5px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255, 255, 255, .26);
      cursor: pointer;
    }

    .progress-track:hover { height: 7px; }
    .progress-fill { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #d88924, #ffd17d); }

    .transport-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .time-display { color: rgba(255, 246, 232, .88); font-size: 11px; font-variant-numeric: tabular-nums; }
    .audio-controls { display: flex; align-items: center; gap: 9px; }
    .view-controls { display: flex; justify-content: flex-end; gap: 7px; }

    .audio-controls button, .transport button {
      border: 1px solid rgba(244, 211, 166, .2);
      border-radius: 99px;
      background: rgba(18, 14, 11, .76);
      color: #f7e9d5;
      cursor: pointer;
    }

    .audio-controls button { padding: 5px 10px; font-size: 11px; }
    .volume-slider { width: 90px; accent-color: #e8a541; cursor: pointer; }
    .transport-controls { display: flex; align-items: center; gap: 7px; }
    .transport-controls button { padding: 5px 9px; font-size: 11px; }
    .view-controls button { padding: 5px 9px; font-size: 10px; }

    .skip-controls {
      position: absolute;
      top: 50%;
      right: 12px;
      display: grid;
      gap: 8px;
      transform: translateY(-50%);
    }

    .skip-controls button {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border: 1px solid rgba(255, 235, 205, .18);
      border-radius: 50%;
      background: rgba(10, 8, 7, .7);
      color: #fff0d6;
      cursor: pointer;
    }

    .comments-panel {
      display: flex;
      flex: 0 0 350px;
      flex-direction: column;
      min-width: 0;
      border-left: 1px solid var(--line);
      background: linear-gradient(155deg, rgba(29, 23, 18, .92), rgba(12, 10, 9, .98));
    }

    .comments-heading {
      display: flex;
      min-height: 67px;
      align-items: center;
      justify-content: space-between;
      padding: 0 21px;
      border-bottom: 1px solid var(--line);
    }

    .comments-heading h2 { margin: 0; color: #f2dfc2; font-size: 14px; font-weight: 600; }
    .comments-heading span { color: var(--muted); font-size: 12px; }
    .comment-list { flex: 1; overflow: auto; padding: 8px 18px; overscroll-behavior: contain; }

    .comment {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr) auto;
      align-items: start;
      gap: 10px;
      padding: 13px 0;
      border-bottom: 1px solid rgba(235, 193, 128, .08);
    }

    .avatar {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border: 1px solid rgba(225, 169, 91, .25);
      border-radius: 50%;
      background: rgba(172, 103, 38, .18);
      color: #edc17a;
      font-size: 13px;
    }

    .comment-body { min-width: 0; }
    .comment-author { color: #e6c99d; font-size: 12px; font-weight: 600; }
    .comment-text { margin-top: 5px; color: #f1e8dc; font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; white-space: pre-wrap; }
    .comment-time { margin-top: 6px; color: #8f8271; font-size: 10px; }

    .like-button {
      padding: 3px 4px;
      border: 0;
      background: transparent;
      color: #a39484;
      cursor: pointer;
      font-size: 12px;
    }

    .like-button.liked { color: #e78369; }

    .comment-form {
      display: grid;
      gap: 9px;
      padding: 15px;
      border-top: 1px solid var(--line);
      background: rgba(7, 6, 5, .45);
    }

    .comment-form input {
      width: 100%;
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid rgba(235, 193, 128, .16);
      border-radius: 8px;
      outline: none;
      background: rgba(255, 255, 255, .035);
      color: #f7efe3;
      font-size: 12px;
    }

    .comment-form input:focus { border-color: rgba(231, 167, 79, .58); }
    .comment-form input::placeholder { color: #8d8172; }

    .comment-compose { display: flex; gap: 8px; }
    .comment-compose input { flex: 1; }

    .send-button {
      padding: 0 15px;
      border: 1px solid rgba(239, 177, 82, .45);
      border-radius: 8px;
      background: linear-gradient(140deg, rgba(171, 100, 31, .48), rgba(93, 52, 18, .45));
      color: #ffe4b2;
      cursor: pointer;
      font-size: 12px;
    }

    .send-button:hover { background: rgba(171, 100, 31, .68); }
    .no-comments { padding: 24px 8px; color: #988a78; text-align: center; font-size: 12px; line-height: 1.6; }
